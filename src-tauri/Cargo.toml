[package]
name = "vocal-align"
version = "0.1.0"
description = "VocalAlign Core Audio Engine & Desktop App"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm", "isomp4", "flac", "ogg", "vorbis", "mkv", "aac"] }
rodio = "0.19"
parking_lot = "0.12"
rayon = "1.10"
regex = "1.11"
once_cell = "1.20"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread"] }

# Dev profile optimization settings
[profile.dev]
incremental = false


